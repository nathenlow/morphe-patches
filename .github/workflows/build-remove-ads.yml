name: Build Remove Ads bundle

on:
  workflow_dispatch:
  push:
    branches: [remove-ads]

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: burrunan/gradle-cache-action@v3

      - name: Build Android bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE=$(ls patches/build/libs/patches-*.mpp | grep -v -e sources -e javadoc | head -1)
          cp "$FILE" patches.mpp
          VERSION="1.0.${{ github.run_number }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/remove-ads"
          jq -n \
            --arg created "$(date -u +%Y-%m-%dT%H:%M:%S)" \
            --arg url "$BASE/patches.mpp" \
            --arg version "$VERSION" \
            '{created_at: $created, description: "Remove ads universal patch", download_url: $url, signature_download_url: "", version: $version, public_key: ""}' \
            > patches-bundle.json
          gh release delete remove-ads --yes --cleanup-tag || true
          gh release create remove-ads patches.mpp patches-bundle.json --title "Remove Ads bundle" --notes "Latest build"
