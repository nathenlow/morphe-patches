name: Build Remove Ads bundle

on:
  workflow_dispatch:
  push:
    branches: [remove-ads]

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: burrunan/gradle-cache-action@v3

      - name: Build Android bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE=$(ls patches/build/libs/patches-*.mpp | grep -v -e sources -e javadoc | head -1)
          gh release delete remove-ads --yes --cleanup-tag || true
          gh release create remove-ads "$FILE#patches.mpp" --title "Remove Ads bundle" --notes "Latest build"
